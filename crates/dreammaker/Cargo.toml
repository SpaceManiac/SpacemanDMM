[package]
name = "dreammaker"
version = "0.1.0"
authors = ["Tad Hardesty <tad@platymuus.com>"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
interval-tree = { path = "../interval-tree" }
dreammaker-macros = { path = "../dreammaker-macros" }
bitflags = "2.13.1"
termcolor = "1.4.1"
ordered-float = "5.3.0"
serde = { version = "1.0.213", features = ["derive"] }
serde_derive = "1.0.213"
toml = "1.1.4"
phf = { version = "0.14.0", features = ["macros"] }
color_space = "0.5.4"
foldhash = "0.2.0"
indexmap = "2.6.0"
get-size = "0.1.4"
get-size-derive = "0.1.3"
beef = "0.5.2"

[dev-dependencies]
walkdir = "2.5.0"
serde_json = "1.0.132"
